<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星辰科技 · AI 助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f5f3; color: #2c2c2a;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 16px 24px; background: #fff;
    border-bottom: 1px solid #e5e3dc;
    font-size: 15px; font-weight: 500;
  }
  header span { color: #888780; font-weight: 400; font-size: 13px; margin-left: 8px; }
  #chat {
    flex: 1; overflow-y: auto; padding: 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.65; font-size: 14px; white-space: pre-wrap; }
  .me { align-self: flex-end; background: #185FA5; color: #fff; }
  .ai { align-self: flex-start; background: #fff; border: 1px solid #e5e3dc; }
  .ai.thinking { color: #888780; }
  footer {
    display: flex; gap: 10px; padding: 16px 24px;
    background: #fff; border-top: 1px solid #e5e3dc;
  }
  #q {
    flex: 1; padding: 11px 14px; font-size: 14px;
    border: 1px solid #d3d1c7; border-radius: 8px; outline: none;
    font-family: inherit;
  }
  #q:focus { border-color: #185FA5; }
  button {
    padding: 0 22px; font-size: 14px; border: none; border-radius: 8px;
    background: #185FA5; color: #fff; cursor: pointer; font-family: inherit;
  }
  button:disabled { background: #b4b2a9; cursor: not-allowed; }
</style>
</head>
<body>
<header>星辰科技 · AI 助手 <span>差旅报销 / 日期时间 / 天气</span></header>

<div id="chat"></div>

<footer>
  <input id="q" placeholder="问点什么，比如：住店能报多少？" autocomplete="off">
  <button id="send" onclick="ask()">发送</button>
</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('q');
const btn = document.getElementById('send');

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') ask();
});

function add(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function render(text) {
  let safe = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  return safe.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

async function ask() {
  const question = input.value.trim();
  if (!question) return;

  add(question, 'me');
  input.value = '';
  btn.disabled = true;

  const bubble = add('思考中…', 'ai thinking');

  try {
    const res = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: question })
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);

    bubble.className = 'msg ai';
    bubble.textContent = '';

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buf += decoder.decode(value, { stream: true });
      const events = buf.split('\n\n');
      buf = events.pop();

      for (const ev of events) {
        if (!ev.startsWith('data: ')) continue;
        const payload = ev.slice(6);
        if (payload === '[DONE]') continue;
        bubble.textContent += JSON.parse(payload);
        chat.scrollTop = chat.scrollHeight;
      }
    }

    bubble.innerHTML = render(bubble.textContent);
  } catch (err) {
    bubble.className = 'msg ai';
    bubble.textContent = '出错了：' + err.message + '（检查服务是否在运行）';
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

input.focus();
</script>
</body>
</html>
